<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semáforo Interativo</title>

<style>

/* Estilo geral da página */
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: #1e1e1e;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

/* Caixa do semáforo */
.semaforo{
    background:#000;
    padding:20px;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* Luzes */
.luz{
    width:80px;
    height:80px;
    border-radius:50%;
    margin:10px;
    opacity:0.3;
}

/* Cores */
#vermelho{background:red;}
#amarelo{background:yellow;}
#verde{background:lime;}

/* Luz ativa */
.ativo{
    opacity:1;
    box-shadow:0 0 20px white;
}

/* Botão pedestre */
button{
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    background:#3498db;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

/* Responsividade */
@media (max-width:600px){

.luz{
    width:60px;
    height:60px;
}

}

</style>
</head>

<body>

<h1>Semáforo Interativo</h1>

<div class="semaforo">
    <div id="vermelho" class="luz"></div>
    <div id="amarelo" class="luz"></div>
    <div id="verde" class="luz"></div>
</div>

<button id="botaoPedestre">Pedir passagem 🚶</button>

<script src="semaforo.js"></script>

</body>
</html>
